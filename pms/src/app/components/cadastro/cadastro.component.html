<app-pms-header></app-pms-header>

<div class="cadastro-container">
  <div class="container">
    <div class="row justify-content-center align-items-center" style="height: 100vh;">
      <div class="col-sm-12 col-md-6 col-lg-4">
        <div class="card">
          <div class="card-body">
            <h2 class="text-center mb-4">{{ t('register.title') }}</h2>
            <div class="form-group">
              <label for="userType">{{ t('register.userType') }}</label>
              <select id="userType" class="form-control" [(ngModel)]="selectedOption" name="userType">
                <option value="medico">{{ t('register.doctor') }}</option>
                <option value="paciente">{{ t('register.patient') }}</option>
              </select>
            </div>
            <form (ngSubmit)="submitForm()" #cadastroForm="ngForm">
              <div *ngIf="selectedOption === 'medico'">
                <div class="form-group">
                  <label for="crm">{{ t('register.crm') }}</label>
                  <input type="text" id="crm" class="form-control" [ngClass]="{'is-invalid': invalidFields['medico_crm']}" name="crm" [(ngModel)]="medicoData.crm" required (input)="applyCRMMask($event)" (blur)="validateFields()">
                </div>
                <div class="form-group">
                  <label for="estado">{{ t('register.state') }}</label>
                  <select id="estado" class="form-control" [ngClass]="{'is-invalid': invalidFields['medico_estado']}" name="estado" [(ngModel)]="medicoData.estado" required (change)="validateFields()">
                    <option value="">{{ t('register.selectState') }}</option>
                    <option value="Acre">Acre</option>
                    <option value="Alagoas">Alagoas</option>
                    <option value="Amapá">Amapá</option>
                    <option value="Amazonas">Amazonas</option>
                    <option value="Bahia">Bahia</option>
                    <option value="Ceará">Ceará</option>
                    <option value="Distrito Federal">Distrito Federal</option>
                    <option value="Espírito Santo">Espírito Santo</option>
                    <option value="Goiás">Goiás</option>
                    <option value="Maranhão">Maranhão</option>
                    <option value="Mato Grosso">Mato Grosso</option>
                    <option value="Mato Grosso do Sul">Mato Grosso do Sul</option>
                    <option value="Minas Gerais">Minas Gerais</option>
                    <option value="Pará">Pará</option>
                    <option value="Paraíba">Paraíba</option>
                    <option value="Paraná">Paraná</option>
                    <option value="Pernambuco">Pernambuco</option>
                    <option value="Piauí">Piauí</option>
                    <option value="Rio de Janeiro">Rio de Janeiro</option>
                    <option value="Rio Grande do Norte">Rio Grande do Norte</option>
                    <option value="Rio Grande do Sul">Rio Grande do Sul</option>
                    <option value="Rondônia">Rondônia</option>
                    <option value="Roraima">Roraima</option>
                    <option value="Santa Catarina">Santa Catarina</option>
                    <option value="São Paulo">São Paulo</option>
                    <option value="Sergipe">Sergipe</option>
                    <option value="Tocantins">Tocantins</option>
                  </select>
                </div>
                <div class="form-group">
                  <label for="nome">{{ t('register.firstName') }}</label>
                  <input type="text" id="nome" class="form-control" name="nome" [(ngModel)]="medicoData.nome" required>
                </div>
                <div class="form-group">
                  <label for="sobrenome">{{ t('register.lastName') }}</label>
                  <input type="text" id="sobrenome" class="form-control" name="sobrenome" [(ngModel)]="medicoData.sobrenome" required>
                </div>
                <div class="form-group">
                  <label for="especialidade">{{ t('register.specialty') }}</label>
                  <input type="text" id="especialidade" class="form-control" name="especialidade" [(ngModel)]="medicoData.especialidade" required>
                </div>
                <div class="form-group">
                  <label for="telefone">{{ t('register.phone') }}</label>
                  <input type="text" id="telefone" class="form-control" [ngClass]="{'is-invalid': invalidFields['medico_telefone']}" name="telefone" [(ngModel)]="medicoData.telefone" (input)="applyPhoneMaskMedico($event)" (blur)="validateFields()">
                </div>
                <div class="form-group">
                  <label for="email">{{ t('register.email') }}</label>
                  <input type="email" id="email" class="form-control" [ngClass]="{'is-invalid': invalidFields['medico_email']}" name="email" [(ngModel)]="medicoData.email" required (blur)="validateFields()">
                </div>
                <div class="form-group">
                  <label for="password">{{ t('register.password') }}</label>
                  <input type="password" id="password" class="form-control" name="password" [(ngModel)]="medicoData.senha" required>
                </div>
                <div class="form-group">
                  <label for="confirmPassword">{{ t('register.confirmPassword') }}</label>
                  <input type="password" id="confirmPassword" class="form-control" name="confirmPassword" [(ngModel)]="medicoData.Confirmsenha" required>
                </div>
              </div>
              <div *ngIf="selectedOption === 'paciente'">
                <div class="form-group">
                  <label for="cpf">{{ t('register.cpf') }}</label>
                  <input type="text" id="cpf" class="form-control" [ngClass]="{'is-invalid': invalidFields['paciente_cpf']}" name="cpf" [(ngModel)]="pacienteData.cpf" required (input)="applyCPFMask($event)" (blur)="validateFields()">
                </div>
                <div class="form-group">
                  <label for="nome">{{ t('register.firstName') }}</label>
                  <input type="text" id="nome" class="form-control" name="nome" [(ngModel)]="pacienteData.nome" required>
                </div>
                <div class="form-group">
                  <label for="sobrenome">{{ t('register.lastName') }}</label>
                  <input type="text" id="sobrenome" class="form-control" name="sobrenome" [(ngModel)]="pacienteData.sobrenome" required>
                </div>
                <div class="form-group">
                  <label for="email">{{ t('register.email') }}</label>
                  <input type="email" id="email" class="form-control" [ngClass]="{'is-invalid': invalidFields['paciente_email']}" name="email" [(ngModel)]="pacienteData.email" required (blur)="validateFields()">
                </div>
                <div class="form-group">
                  <label for="telefone">{{ t('register.phone') }}</label>
                  <input type="text" id="telefone" class="form-control" [ngClass]="{'is-invalid': invalidFields['paciente_telefone']}" name="telefone" [(ngModel)]="pacienteData.telefone" required (input)="applyPhoneMask($event)" (blur)="validateFields()">
                </div>
                <div class="form-group">
                  <label for="dataNascimento">{{ t('register.birthDate') }}</label>
                  <input type="date" id="dataNascimento" class="form-control" name="dataNascimento" [(ngModel)]="pacienteData.dataNascimento" required>
                </div>
                <div class="form-group">
                  <label for="endereco">{{ t('register.address') }}</label>
                  <input type="text" id="endereco" class="form-control" name="endereco" [(ngModel)]="pacienteData.endereco" required>
                </div>
                <div class="form-group">
                  <label for="password">{{ t('register.password') }}</label>
                  <input type="password" id="password" class="form-control" name="password" [(ngModel)]="pacienteData.senha" required>
                </div>
                <div class="form-group">
                  <label for="confirmPassword">{{ t('register.confirmPassword') }}</label>
                  <input type="password" id="confirmPassword" class="form-control" name="confirmPassword" [(ngModel)]="pacienteData.Confirmsenha" required>
                </div>
              </div>
          <div class="text-center" style="margin-top: 10px;">
            <button type="submit" class="btn btn-primary btn-block">{{ t('register.register') }}</button>
          </div>
        </form>
        <div class="text-center text-danger mt-3" *ngIf="showError">
          {{ errorMessage }}
        </div>
      </div>
    </div>
  </div>
</div>
  </div>
</div>
<app-pms-footer></app-pms-footer>
