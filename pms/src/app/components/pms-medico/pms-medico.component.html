<div class="medico-container">

    [colunas]="colunas"
    [items]="items"
    [mostrarRemover]="true"
    [novoItemNome]="novoItemNomeValue"
    [novoItemFuncao]="redirecionarParaNewPaciente"

    (onRemoveButtonClick)="onRemoveButton($event)"

  ></app-pms-grid>
</div>

<app-pms-footer></app-pms-footer>
