<app-pms-header></app-pms-header>
<div class="new-paciente-container">
  <div class="d-flex flex-column justify-content-center align-items-center " style="min-height: calc(100vh - 120px);">
    <div class="card" style="width: 80%;">
      <div class="card-body">
        <h2 class="text-center mb-4">{{ t('medico.addPatient') }}</h2>

        <div *ngIf="!cpfExists">
          <div class="form-group">
            <label for="cpf">{{ t('register.patientCpf') }}</label>
            <input type="text" id="cpf" class="form-control" [(ngModel)]="cpf" name="cpf" required>
          </div>

          <div class="text-center" style="margin-top: 10px;">
            <button class="btn btn-primary" (click)="checkExistingCPF()">{{ t('login.enter') }}</button>
          </div>
        </div>

        <form *ngIf="cpfExists" (ngSubmit)="submitForm()" #pacienteForm="ngForm">
          <div class="form-group">
            <label for="nome">{{ t('register.firstName') }}</label>
            <input type="text" id="nome" class="form-control" [(ngModel)]="paciente.nome" name="nome" required>
          </div>
          <div class="form-group">
            <label for="cpf">{{ t('register.cpf') }}</label>
            <input type="text" id="cpf" class="form-control" [(ngModel)]="paciente.cpf" name="cpf" required>
          </div>
          <div class="form-group">
            <label for="telefone">{{ t('register.phone') }}</label>
            <input type="text" id="telefone" class="form-control" [(ngModel)]="paciente.telefone" name="telefone" required>
          </div>

          <div class="text-center" style="margin-top: 10px;">
            <button type="submit" class="btn btn-primary" [disabled]="pacienteForm.invalid">{{ t('register.addPatient') }}</button>
            <button class="btn btn-secondary" style="margin-left: 10px;" (click)="goToMedicoScreen()">{{ t('medico.cancel') }}</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
<app-pms-footer></app-pms-footer>
